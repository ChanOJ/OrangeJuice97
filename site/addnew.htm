<script language="JavaScript">
<!--
// --------------------------------------------------------------------------------------------------------
{
var L=40;
var L2=34;
if (navigator.appName=="Netscape") L=40;
  else if (navigator.appName=="Microsoft Internet Explorer") L=56;
if (navigator.appName=="Netscape") L2=34;
  else if (navigator.appName=="Microsoft Internet Explorer") L2=60;
}
// --------------------------------------------------------------------------------------------------------
function ZoneTexte(nom,val,maxl)
{
return "<input type=\"text\" size=\""+L+"\" maxlength=\""+maxl+"\" name=\""+nom+"\" value=\""+val+"\">";
}
// --------------------------------------------------------------------------------------------------------
function ZoneTexteArea(nom,rows)
{
return "<textarea name=\"nom\" rows=\""+rows+"\" cols=\""+L2+"\"></textarea>";
}
// --------------------------------------------------------------------------------------------------------
function pasbon(texte)
{
 alert(texte);
 return false;
}
function verif_form()
{
var aujourdhui = new Date();
var cette_annee = aujourdhui.getYear();
if (cette_annee<70) cette_annee=cette_annee+2000;
   else if (cette_annee<1000) cette_annee=cette_annee+1900;
if (document.PseudoNew.pseudo.value=="")
   return pasbon("Vous devez inscrire un pseudo.\nSi vous n'en avez pas, incrivez votre vrai nom à la place.");
if ((document.PseudoNew.sexe[0].checked==false)&&(document.PseudoNew.sexe[1].checked==false))
   return pasbon("Vous devez indiquer votre sexe !");
if ((document.PseudoNew.email.value!="")
   &&((document.PseudoNew.email.value.length<3)
    ||(document.PseudoNew.email.value.indexOf("@",0)<0)
    ||(document.PseudoNew.email.value.indexOf(" ",0)>=0)))
   return pasbon("L'adresse e-mail n'est pas valide.\nFormat attendu : nn@xx");
if ((document.PseudoNew.homepage.value!="")
   &&((document.PseudoNew.homepage.value.substring(0,7).toLowerCase()!="http://")
    ||(document.PseudoNew.homepage.value.length<10)
    ||(document.PseudoNew.homepage.value.indexOf(" ",0)>=0)))
   return pasbon("L'URL de la Home Page n'est pas valide.\nElle doit commencer par http://");
if ((document.PseudoNew.fonction.value.length<2)
   ||(document.PseudoNew.fonction.value.substring(0,2)=="ex")
   ||(document.PseudoNew.fonction.value.indexOf(" ",0)>=0))
   return pasbon("Vous devez rentrer votre ou vos fonction(s)\nFormat attendu : xxx/xxx/... (sans espaces)");
if ((document.PseudoNew.statut[0].checked==false)&&(document.PseudoNew.statut[1].checked==false)&&(document.PseudoNew.statut[2].checked==false))
   return pasbon("Vous devez indiquer vorte statut !");
if ((document.PseudoNew.birth_day.value!="")||(document.PseudoNew.birth_month.value!="")||(document.PseudoNew.birth_year.value!=""))
          {
          if ((document.PseudoNew.birth_day.value=="")||(document.PseudoNew.birth_day.value<1)||(document.PseudoNew.birth_day.value>31))
              return pasbon("Le jour de votre date de naissance n'est pas valide");
          if ((document.PseudoNew.birth_month.value=="")||(document.PseudoNew.birth_month.value<1)||(document.PseudoNew.birth_month.value>12))
              return pasbon("Le mois de votre date de naissance n'est pas valide");
          if ((document.PseudoNew.birth_year.value=="")||((document.PseudoNew.birth_year.value<1920)&&(document.PseudoNew.birth_year.value>999))||(document.PseudoNew.birth_year.value>(cette_annee - 6)))
              return pasbon("L'année de votre date de naissance n'est pas valide.");
          if ((document.PseudoNew.birth_year.value<1000))
              return pasbon("Vous devez mettre 4 chiffres pour votre année de naissance !");
          }
if ((document.PseudoNew.photo_id.value!="")
   &&((document.PseudoNew.photo_id.value.length<5)
   ||(document.PseudoNew.photo_id.value.indexOf(" ",0)>=0)
   ||((document.PseudoNew.photo_id.value.substring(document.PseudoNew.photo_id.value.length-4,document.PseudoNew.photo_id.value.length).toLowerCase()!=".jpg")
   &&(document.PseudoNew.photo_id.value.substring(document.PseudoNew.photo_id.value.length-4,document.PseudoNew.photo_id.value.length).toLowerCase()!=".gif"))))
   return pasbon("Le nom du fichier Photo d'Identité n'est pas valide.\nEst-ce bien un .GIF ou un .JPG ?");
if ((document.PseudoNew.annee_scene.value=="")||(document.PseudoNew.annee_scene.value<1970)||(document.PseudoNew.annee_scene.value>cette_annee))
   return pasbon("L'année à partir de laquelle vous avez commencé à vous interesser à la scene n'est pas valide.\nVous devez obligatoirement remplir ce champ (4 chiffres) !");
if ((document.PseudoNew.IRC_canal.value!="")&&(document.PseudoNew.IRC_serveur[0].checked==false)&&(document.PseudoNew.IRC_serveur[0].checked==false))
   return pasbon("Vous devez cocher EFNET ou UNDERNET pour l' IRC !");
if (confirm("Etes vous certain de vouloir envoyer ce formulaire ?")==true)
{
   history.back();
   return true;
}
return false;
}
// --------------------------------------------------------------------------------------------------------
// -->
</script>
